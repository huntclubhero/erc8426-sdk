[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
# Windows, cooldowns, expiries and show times are all timestamp based by
# design, at granularities (minutes to days) that validator drift cannot move.
exclude_lints = ["block-timestamp"]
